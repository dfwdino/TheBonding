             C 228,60 310,130 320,200
             C 330,255 300,285 285,300
             C 295,265 280,245 265,255
             C 285,210 260,165 228,130
             C 196,165 171,210 191,255
             C 176,245 161,265 171,300
             C 156,285 126,255 136,200
