name: Build & Release

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_NAME: TheBonding
  PROJECT: src/TheBonding.Maui/TheBonding.Maui.csproj

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - name: Extract version from csproj
      id: extract
      run: |
        VERSION=$(grep -oP '(?<=<ApplicationDisplayVersion>)[^<]+' src/TheBonding.Maui/TheBonding.Maui.csproj | head -1)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "App version: $VERSION"

  build-android:
    runs-on: ubuntu-latest
    needs: get-version
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install MAUI Android workload
      run: dotnet workload install maui-android

    - name: Build Android
      run: dotnet build ${{ env.PROJECT }} -f net10.0-android -c Release

    - name: Rename APK
      run: |
        mkdir -p artifacts
        cp src/TheBonding.Maui/bin/Release/net10.0-android/*.apk "artifacts/${{ env.APP_NAME }} - ${{ env.VERSION }}.apk"

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: artifacts/*.apk

  build-windows:
    runs-on: windows-latest
    needs: get-version
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install MAUI Windows workload
      run: dotnet workload install maui

    - name: Build Windows
      run: dotnet build ${{ env.PROJECT }} -f net10.0-windows10.0.19041.0 -r win-x64 -c Release

    - name: Zip Windows build
      run: Compress-Archive -Path "src/TheBonding.Maui/bin/Release/net10.0-windows10.0.19041.0/win-x64/*" -DestinationPath "${{ env.APP_NAME }} - ${{ env.VERSION }}.zip"

    - name: Upload Windows build
      uses: actions/upload-artifact@v4
      with:
        name: windows-app
        path: "${{ env.APP_NAME }} - ${{ env.VERSION }}.zip"

  release:
    needs: [get-version, build-android, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
    - name: Download Android APK
      uses: actions/download-artifact@v4
      with:
        name: android-apk
        path: artifacts/android

    - name: Download Windows build
      uses: actions/download-artifact@v4
      with:
        name: windows-app
        path: artifacts/windows

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}-build.${{ github.run_number }}
        name: "${{ env.APP_NAME }} - ${{ env.VERSION }}"
        body: "Automated release from commit ${{ github.sha }}"
        files: |
          artifacts/android/*.apk
          artifacts/windows/*.zip
